# Pin Node so Railway's autodetect doesn't drift between deploys.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npx prisma generate", "npm run build", "npm prune --production"]

[start]
cmd = "npx prisma db push --skip-generate && node dist/main.js"
